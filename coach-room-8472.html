<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SportsMistakes Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 70% 20%,rgba(255,48,48,.14),transparent 28%),linear-gradient(180deg,#03070c,#06101a);color:#fff;font-family:Arial,sans-serif;padding:32px}.wrap{max-width:1120px;margin:0 auto}header{display:flex;justify-content:space-between;gap:18px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12)}h1,h2{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;text-transform:uppercase}h1{font-size:56px;line-height:.9}h1 span{color:#ff3030;display:block;font-style:italic}h2{font-size:32px;margin-bottom:16px}.status,.card{background:rgba(14,30,47,.94);border:1px solid rgba(255,255,255,.12);border-radius:16px}.status{padding:14px 16px;min-width:230px;font-weight:800}.status strong{display:block;color:#39df69}.grid{display:grid;grid-template-columns:.9fr 1.25fr;gap:18px}.card{padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.32)}label{display:block;color:#aab7c5;font-weight:900;margin:14px 0 7px;text-transform:uppercase;font-size:12px}input,textarea,select{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.24);color:#fff;border-radius:10px;padding:14px;font-size:15px}textarea{min-height:96px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:14px 16px;background:linear-gradient(180deg,#ff3333,#c91622);color:#fff;font-weight:900;text-transform:uppercase;cursor:pointer;margin-top:16px;width:100%}.btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.btn.green{background:linear-gradient(180deg,#39df69,#15943f);color:#04100a}.btn.yellow{background:linear-gradient(180deg,#ffd12f,#d99500);color:#150d00}.small-note{color:#aab7c5;font-size:13px;margin-top:12px}.polls{display:grid;gap:12px}.poll{border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);border-radius:14px;padding:16px}.poll-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.badge.active{background:rgba(57,223,105,.16);color:#39df69;border:1px solid rgba(57,223,105,.35)}.badge.draft{background:rgba(255,255,255,.08);color:#aab7c5;border:1px solid rgba(255,255,255,.12)}.badge.closed{background:rgba(255,48,48,.16);color:#ff3030;border:1px solid rgba(255,48,48,.35)}.meta{color:#aab7c5;font-size:13px;margin-bottom:12px}.linkbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0}.linkbox input{font-size:12px;padding:11px}.mini{border:0;border-radius:8px;padding:10px 12px;background:#fff;color:#06101a;font-weight:900;cursor:pointer}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.actions .btn{margin-top:0;padding:11px 10px;font-size:12px}.bar-label{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin:8px 0 5px}.track{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}.fill{height:100%;background:#39df69}.fill.red{background:#ff3030}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#fff;color:#06101a;font-weight:900;padding:14px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:860px){body{padding:20px}header,.grid{display:grid;grid-template-columns:1fr}.row,.actions,.linkbox{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><header><div><h1>Sports<span>Mistakes Admin</span></h1><p class="small-note">Create polls. Copy links. Activate chaos.</p></div><div class="status" id="connectionStatus"><strong>Checking...</strong>Supabase connection</div></header>
<main class="grid"><section class="card"><h2>Create Poll</h2><form id="pollForm"><label>Poll Question</label><textarea id="question" required placeholder="Should the coach pull the goalie?"></textarea><div class="row"><div><label>Option 1</label><input id="option1" value="YES" required></div><div><label>Option 2</label><input id="option2" value="NO" required></div></div><div class="row"><div><label>Team</label><input id="team" value="canadiens" required></div><div><label>Duration</label><select id="duration"><option value="30">30 seconds</option><option value="60" selected>1 minute</option><option value="300">5 minutes</option><option value="600">10 minutes</option></select></div></div><label>Start Status</label><select id="status"><option value="draft">Draft</option><option value="active">Active</option><option value="closed">Closed</option></select><button class="btn" id="createBtn">Create Poll + Generate Link</button><button class="btn secondary" type="button" id="refreshBtn">Refresh Polls</button></form><p class="small-note">Keep this page hidden until login security is added.</p></section><section class="card"><h2>Poll Control Room</h2><div class="polls" id="pollsList"></div></section></main></div><div class="toast" id="toast">Saved</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xhztytiobuhrhdwfmqnl.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoenR5dGlvYnVocmhkd2ZtcW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTEyMjcsImV4cCI6MjA5NDE2NzIyN30.PovmzhbLwNg1MYHsCiGqjhiUY52iwrWZUtyvNkVFi7I";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const connectionStatus=document.getElementById('connectionStatus'),pollForm=document.getElementById('pollForm'),question=document.getElementById('question'),option1=document.getElementById('option1'),option2=document.getElementById('option2'),team=document.getElementById('team'),duration=document.getElementById('duration'),statusInput=document.getElementById('status'),pollsList=document.getElementById('pollsList'),createBtn=document.getElementById('createBtn'),refreshBtn=document.getElementById('refreshBtn');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}function pollUrl(id){return `${location.origin}${location.pathname.replace(/[^\/]*$/,'')}poll.html?id=${id}`}function fmt(sec){if(sec===null)return'No timer';sec=Math.max(0,sec);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}function left(p){return p.ends_at?Math.floor((new Date(p.ends_at)-new Date())/1000):null}
async function test(){const{error}=await sb.from('polls').select('id').limit(1);connectionStatus.innerHTML=error?`<strong style="color:#ff3030">Not Connected</strong>${error.message}`:`<strong>Connected ✅</strong>Ready to manage polls.`}
async function closeExpired(){const{data}=await sb.from('polls').select('id,ends_at,status').eq('status','active');for(const p of data||[])if(p.ends_at&&new Date(p.ends_at)<=new Date())await sb.from('polls').update({status:'closed'}).eq('id',p.id)}
async function counts(p){const{data}=await sb.from('votes').select('vote').eq('poll_id',p.id);const a=(data||[]).filter(v=>v.vote===p.option_1).length,b=(data||[]).filter(v=>v.vote===p.option_2).length;return{a,b,total:(data||[]).length}}
async function loadPolls(){pollsList.innerHTML='<p class="small-note">Loading polls...</p>';await closeExpired();const{data,error}=await sb.from('polls').select('*').order('created_at',{ascending:false});if(error){pollsList.innerHTML=`<p class="small-note">Error: ${esc(error.message)}</p>`;return}if(!data||!data.length){pollsList.innerHTML='<p class="small-note">No polls yet.</p>';return}let out=[];for(const p of data){const c=await counts(p),ap=c.total?Math.round(c.a/c.total*100):0,bp=c.total?100-ap:0,u=pollUrl(p.id),s=left(p);out.push(`<article class="poll"><div class="poll-top"><h3>${esc(p.question)}</h3><span class="badge ${esc(p.status)}">${esc(p.status)}</span></div><div class="meta">Team: ${esc(p.team)} • Votes: ${c.total} • Duration: ${p.duration_seconds||60}s • Time left: ${fmt(s)}</div><div class="linkbox"><input readonly value="${esc(u)}" id="link-${p.id}"><button class="mini" onclick="copyLink('${p.id}')">Copy Link</button></div><div><div class="bar-label"><span>${esc(p.option_1)}</span><span>${c.a} votes • ${ap}%</span></div><div class="track"><div class="fill" style="width:${ap}%"></div></div><div class="bar-label"><span>${esc(p.option_2)}</span><span>${c.b} votes • ${bp}%</span></div><div class="track"><div class="fill red" style="width:${bp}%"></div></div></div><div class="actions"><button class="btn green" onclick="activatePoll('${p.id}',${p.duration_seconds||60})">Activate</button><button class="btn yellow" onclick="closePoll('${p.id}')">Close</button><button class="btn secondary" onclick="openPoll('${p.id}')">Open Poll</button><button class="btn secondary" onclick="deletePoll('${p.id}')">Delete</button></div></article>`)}pollsList.innerHTML=out.join('')}
async function createPoll(e){e.preventDefault();createBtn.disabled=true;createBtn.textContent='Creating...';const dur=Number(duration.value||60),st=statusInput.value,ends=st==='active'?new Date(Date.now()+dur*1000).toISOString():null;if(st==='active')await sb.from('polls').update({status:'closed'}).eq('status','active');const{data,error}=await sb.from('polls').insert({question:question.value.trim(),option_1:option1.value.trim(),option_2:option2.value.trim(),team:team.value.trim(),status:st,duration_seconds:dur,ends_at:ends}).select().single();createBtn.disabled=false;createBtn.textContent='Create Poll + Generate Link';if(error){toast(`Create failed: ${error.message}`);return}toast('Poll created.');pollForm.reset();option1.value='YES';option2.value='NO';team.value='canadiens';duration.value='60';statusInput.value='draft';await loadPolls();if(data)setTimeout(()=>copyLink(data.id),300)}
async function activatePoll(id,dur=60){await sb.from('polls').update({status:'closed'}).eq('status','active');const{error}=await sb.from('polls').update({status:'active',ends_at:new Date(Date.now()+dur*1000).toISOString(),duration_seconds:dur}).eq('id',id);if(error)toast(error.message);else{toast('Poll activated.');loadPolls()}}async function closePoll(id){const{error}=await sb.from('polls').update({status:'closed'}).eq('id',id);if(error)toast(error.message);else{toast('Poll closed.');loadPolls()}}async function deletePoll(id){if(!confirm('Delete this poll and votes?'))return;const{error}=await sb.from('polls').delete().eq('id',id);if(error)toast(error.message);else{toast('Poll deleted.');loadPolls()}}function openPoll(id){window.open(pollUrl(id),'_blank')}async function copyLink(id){const input=document.getElementById(`link-${id}`);if(!input)return;try{await navigator.clipboard.writeText(input.value)}catch(e){input.select();document.execCommand('copy')}toast('Poll link copied.')}
window.activatePoll=activatePoll;window.closePoll=closePoll;window.deletePoll=deletePoll;window.openPoll=openPoll;window.copyLink=copyLink;pollForm.addEventListener('submit',createPoll);refreshBtn.addEventListener('click',loadPolls);test().then(loadPolls);setInterval(loadPolls,7000);
</script></body></html>
