<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMS Community Poll</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .back-link {
      color: #93c5fd;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 2rem;
      line-height: 1.2;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .option-btn {
      width: 100%;
      background: #334155;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .option-btn:hover {
      background: #475569;
    }

    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
    }

    .success {
      background: #14532d;
    }

    .error {
      background: #7f1d1d;
    }

    .results {
      margin-top: 25px;
    }

    .result-row {
      margin-bottom: 18px;
    }

    .result-label {
      margin-bottom: 6px;
      font-weight: bold;
    }

    .bar-bg {
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      height: 24px;
    }

    .bar-fill {
      background: #22c55e;
      height: 100%;
      line-height: 24px;
      text-align: right;
      padding-right: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      min-width: 0;
    }

    .muted {
      color: #cbd5e1;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a class="back-link" href="index.html">← Back to Polls</a>

    <div class="card">
      <div id="app">Loading poll...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://xhztytiobuhrhdwfmqnl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoenR5dGlvYnVocmhkd2ZtcW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTEyMjcsImV4cCI6MjA5NDE2NzIyN30.PovmzhbLwNg1MYHsCiGqjhiUY52iwrWZUtyvNkVFi7I";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const pollId = params.get("id");

    const app = document.getElementById("app");

    let poll = null;
    let options = [];
    let votes = [];

    function getVoterId() {
      let voterId = localStorage.getItem("sms_voter_id");

      if (!voterId) {
        voterId = crypto.randomUUID();
        localStorage.setItem("sms_voter_id", voterId);
      }

      return voterId;
    }

    function getOptionsFromPoll(pollData) {
      if (Array.isArray(pollData.options)) {
        return pollData.options.filter(Boolean);
      }

      if (Array.isArray(pollData.poll_options)) {
        return pollData.poll_options.filter(Boolean);
      }

      if (Array.isArray(pollData.answers)) {
        return pollData.answers.filter(Boolean);
      }

      return [
        pollData.option_1,
        pollData.option_2,
        pollData.option_3,
        pollData.option_4,
        pollData.option_5,
        pollData.option_6
      ].filter(Boolean);
    }

    async function loadPoll() {
      if (!pollId) {
        app.innerHTML = "Poll not found.";
        return;
      }

      const { data: pollData, error: pollError } = await supabaseClient
        .from("polls")
        .select("*")
        .eq("id", pollId)
        .single();

      if (pollError || !pollData) {
        console.error(pollError);
        app.innerHTML = "Poll not found.";
        return;
      }

      poll = pollData;
      options = getOptionsFromPoll(poll);

      const { data: voteData, error: voteError } = await supabaseClient
        .from("poll_votes")
        .select("*")
        .eq("poll_id", pollId);

      if (voteError) {
        console.error(voteError);
        votes = [];
      } else {
        votes = voteData || [];
      }

      render();
    }

    function hasAlreadyVoted() {
      const voterId = getVoterId();
      return votes.some(vote => vote.voter_id === voterId);
    }

    function getQuestionText() {
      return poll.question || poll.title || poll.name || "Untitled poll";
    }

    function getVoteOptionIndex(vote) {
      if (typeof vote.option_index === "number") return vote.option_index;
      if (typeof vote.choice_index === "number") return vote.choice_index;

      if (vote.option_text) {
        return options.indexOf(vote.option_text);
      }

      if (vote.option) {
        return options.indexOf(vote.option);
      }

      if (vote.choice) {
        return options.indexOf(vote.choice);
      }

      return -1;
    }

    function render() {
      if (!options.length) {
        app.innerHTML = `
          <h1>${getQuestionText()}</h1>
          <p class="muted">No voting options were found for this poll.</p>
        `;
        return;
      }

      const alreadyVoted = hasAlreadyVoted();

      let html = `
        <h1>${getQuestionText()}</h1>
      `;

      if (!alreadyVoted) {
        options.forEach((option, index) => {
          html += `
            <button class="option-btn" onclick="submitVote(${index})">
              ${option}
            </button>
          `;
        });
      } else {
        html += `
          <div class="message success">
            You already voted in this poll.
          </div>
        `;
      }

      html += renderResults();

      app.innerHTML = html;
    }

    function renderResults() {
      const counts = options.map(() => 0);

      votes.forEach(vote => {
        const index = getVoteOptionIndex(vote);
        if (index >= 0 && counts[index] !== undefined) {
          counts[index]++;
        }
      });

      const totalVotes = votes.length;

      let html = `
        <div class="results">
      `;

      options.forEach((option, index) => {
        const count = counts[index];
        const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

        html += `
          <div class="result-row">
            <div class="result-label">${option} (${count})</div>
            <div class="bar-bg">
              <div class="bar-fill" style="width:${percent}%;">
                ${percent}%
              </div>
            </div>
          </div>
        `;
      });

      html += `
          <div class="muted">Total votes: ${totalVotes}</div>
        </div>
      `;

      return html;
    }

    async function submitVote(optionIndex) {
      const voterId = getVoterId();
      const selectedOption = options[optionIndex];

      let insertResult = await supabaseClient
        .from("poll_votes")
        .insert({
          poll_id: pollId,
          voter_id: voterId,
          option_index: optionIndex,
          option_text: selectedOption
        });

      if (insertResult.error) {
        insertResult = await supabaseClient
          .from("poll_votes")
          .insert({
            poll_id: pollId,
            voter_id: voterId,
            option_index: optionIndex
          });
      }

      if (insertResult.error) {
        console.error(insertResult.error);

        app.innerHTML += `
          <div class="message error">
            Vote failed. You may have already voted.
          </div>
        `;

        return;
      }

      await loadPoll();
    }

    loadPoll();
  </script>

</body>
</html>
