<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMS Community Poll</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      padding:0;
      background:#0f172a;
      color:white;
      font-family:Arial, sans-serif;
    }

    .container{
      max-width:700px;
      margin:40px auto;
      padding:20px;
    }

    .card{
      background:#1e293b;
      border-radius:18px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      margin-top:0;
      font-size:2rem;
      line-height:1.2;
    }

    .option{
      margin-bottom:15px;
    }

    .vote-btn{
      width:100%;
      border:none;
      border-radius:12px;
      padding:16px;
      font-size:1rem;
      font-weight:bold;
      cursor:pointer;
      background:#334155;
      color:white;
      transition:0.2s;
    }

    .vote-btn:hover{
      background:#475569;
    }

    .results{
      margin-top:30px;
    }

    .result-row{
      margin-bottom:18px;
    }

    .result-label{
      margin-bottom:6px;
      font-weight:bold;
    }

    .bar-bg{
      background:#334155;
      border-radius:999px;
      overflow:hidden;
      height:24px;
    }

    .bar-fill{
      background:#22c55e;
      height:100%;
      text-align:right;
      padding-right:10px;
      line-height:24px;
      font-size:0.85rem;
      font-weight:bold;
      color:white;
    }

    .message{
      margin-top:25px;
      padding:14px;
      border-radius:10px;
      font-weight:bold;
      text-align:center;
    }

    .success{
      background:#14532d;
    }

    .error{
      background:#7f1d1d;
    }

    .loading{
      text-align:center;
      padding:50px;
      font-size:1.2rem;
    }

    .back-link{
      display:inline-block;
      margin-bottom:20px;
      color:#93c5fd;
      text-decoration:none;
    }

    .total-votes{
      margin-top:25px;
      opacity:0.8;
      font-size:0.95rem;
    }
  </style>
</head>
<body>

<div class="container">

  <a class="back-link" href="index.html">
    ← Back to Polls
  </a>

  <div class="card">

    <div id="loading" class="loading">
      Loading poll...
    </div>

    <div id="poll-content" style="display:none;">
      <h1 id="poll-title"></h1>

      <div id="vote-section"></div>

      <div id="message"></div>

      <div class="results" id="results"></div>

      <div class="total-votes" id="total-votes"></div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://xhztytiobuhrhdwfmqnl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoenR5dGlvYnVocmhkd2ZtcW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTEyMjcsImV4cCI6MjA5NDE2NzIyN30.PovmzhbLwNg1MYHsCiGqjhiUY52iwrWZUtyvNkVFi7I";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const params = new URLSearchParams(window.location.search);
  const pollId = params.get('id');

  const loadingEl = document.getElementById('loading');
  const pollContentEl = document.getElementById('poll-content');
  const pollTitleEl = document.getElementById('poll-title');
  const voteSectionEl = document.getElementById('vote-section');
  const resultsEl = document.getElementById('results');
  const messageEl = document.getElementById('message');
  const totalVotesEl = document.getElementById('total-votes');

  let pollData = null;

  function getVoterId() {
    let voterId = localStorage.getItem('sms_voter_id');

    if (!voterId) {
      voterId = crypto.randomUUID();
      localStorage.setItem('sms_voter_id', voterId);
    }

    return voterId;
  }

  async function loadPoll() {

    if (!pollId) {
      loadingEl.innerHTML = "Poll not found.";
      return;
    }

    const { data, error } = await supabaseClient
      .from('polls')
      .select('*')
      .eq('id', pollId)
      .single();

    if (error || !data) {
      console.error(error);

      loadingEl.innerHTML = "Could not load poll.";
      return;
    }

    pollData = data;

    loadingEl.style.display = 'none';
    pollContentEl.style.display = 'block';

    renderPoll();
  }

  function renderPoll() {

    pollTitleEl.textContent = pollData.question;

    const options = pollData.options || [];
    const votes = pollData.votes || [];

    const voterId = getVoterId();

    const alreadyVoted = votes.some(v => v.voter_id === voterId);

    voteSectionEl.innerHTML = '';

    if (!alreadyVoted) {

      options.forEach((option, index) => {

        const wrapper = document.createElement('div');
        wrapper.className = 'option';

        wrapper.innerHTML = `
          <button class="vote-btn" onclick="submitVote(${index})">
            ${option}
          </button>
        `;

        voteSectionEl.appendChild(wrapper);
      });

    } else {

      voteSectionEl.innerHTML = `
        <div class="message success">
          You already voted in this poll.
        </div>
      `;
    }

    renderResults();
  }

  function renderResults() {

    const options = pollData.options || [];
    const votes = pollData.votes || [];

    const counts = {};

    options.forEach(option => {
      counts[option] = 0;
    });

    votes.forEach(vote => {
      if (counts[vote.option] !== undefined) {
        counts[vote.option]++;
      }
    });

    const totalVotes = votes.length;

    resultsEl.innerHTML = '';

    options.forEach(option => {

      const count = counts[option] || 0;

      const percent = totalVotes > 0
        ? Math.round((count / totalVotes) * 100)
        : 0;

      const row = document.createElement('div');
      row.className = 'result-row';

      row.innerHTML = `
        <div class="result-label">
          ${option} (${count})
        </div>

        <div class="bar-bg">
          <div
            class="bar-fill"
            style="width:${percent}%"
          >
            ${percent}%
          </div>
        </div>
      `;

      resultsEl.appendChild(row);
    });

    totalVotesEl.textContent =
      `Total votes: ${totalVotes}`;
  }

  async function submitVote(optionIndex) {

    const voterId = getVoterId();

    const selectedOption = pollData.options[optionIndex];

    const updatedVotes = [
      ...(pollData.votes || []),
      {
        voter_id: voterId,
        option: selectedOption
      }
    ];

    const { error } = await supabaseClient
      .from('polls')
      .update({
        votes: updatedVotes
      })
      .eq('id', pollId);

    if (error) {

      console.error(error);

      messageEl.className = 'message error';

      messageEl.innerHTML =
        'Vote failed. You may already have voted.';

      return;
    }

    pollData.votes = updatedVotes;

    messageEl.className = 'message success';

    messageEl.innerHTML =
      'Vote submitted successfully!';

    renderPoll();
  }

  loadPoll();
</script>

</body>
</html>
