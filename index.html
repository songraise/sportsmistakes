<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SportsMistakes Polls</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 40px;
      align-items: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 3rem;
      line-height: 1.05;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 1.15rem;
      line-height: 1.5;
      max-width: 600px;
    }

    .phone {
      background: #020617;
      border: 10px solid #334155;
      border-radius: 38px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    .phone-screen {
      background: #1e293b;
      border-radius: 26px;
      padding: 22px;
      min-height: 430px;
    }

    .section-title {
      font-size: 1.7rem;
      margin-bottom: 20px;
    }

    .poll-card {
      background: #1e293b;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .poll-question {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      background: #334155;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin: 8px 0;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .option-btn:hover {
      background: #475569;
    }

    .results {
      margin-top: 18px;
    }

    .result-row {
      margin-bottom: 14px;
    }

    .result-label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .bar-bg {
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      height: 22px;
    }

    .bar-fill {
      background: #22c55e;
      height: 100%;
      line-height: 22px;
      text-align: right;
      padding-right: 8px;
      font-size: .8rem;
      font-weight: bold;
    }

    .muted {
      color: #cbd5e1;
      font-size: .95rem;
      margin-top: 12px;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 12px;
    }

    .success {
      background: #14532d;
    }

    .error {
      background: #7f1d1d;
    }

    .open-link {
      display: inline-block;
      margin-top: 14px;
      color: #93c5fd;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 850px) {
      .hero {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2.4rem;
      }

      .phone {
        max-width: 360px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <section class="hero">
      <div>
        <h1>Sports mistakes deserve a vote.</h1>
        <p class="subtitle">
          Vote on the worst calls, coaching decisions, player mistakes, and game-changing moments.
        </p>
      </div>

      <div class="phone">
        <div class="phone-screen">
          <div id="featuredPoll">Loading featured poll...</div>
        </div>
      </div>
    </section>

    <h2 class="section-title">Recent Polls</h2>
    <div id="recentPolls">Loading polls...</div>

  </div>

  <script>
    const SUPABASE_URL = "https://xhztytiobuhrhdwfmqnl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoenR5dGlvYnVocmhkd2ZtcW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTEyMjcsImV4cCI6MjA5NDE2NzIyN30.PovmzhbLwNg1MYHsCiGqjhiUY52iwrWZUtyvNkVFi7I";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const featuredPollEl = document.getElementById("featuredPoll");
    const recentPollsEl = document.getElementById("recentPolls");

    let polls = [];
    let allVotes = [];

    function getVoterId() {
      let voterId = localStorage.getItem("sms_voter_id");

      if (!voterId) {
        voterId = crypto.randomUUID();
        localStorage.setItem("sms_voter_id", voterId);
      }

      return voterId;
    }

    function getOptionsFromPoll(poll) {
      return [
        poll.option_1,
        poll.option_2,
        poll.option_3,
        poll.option_4,
        poll.option_5,
        poll.option_6
      ].filter(Boolean);
    }

    function getQuestionText(poll) {
      return poll.question || poll.title || "Untitled poll";
    }

    function getVoteChoice(vote) {
      return vote.option_selected ||
             vote.choice ||
             vote.option ||
             vote.option_text ||
             vote.vote ||
             "";
    }

    function getVotesForPoll(pollId) {
      return allVotes.filter(vote => vote.poll_id === pollId);
    }

    function hasAlreadyVoted(pollId) {
      const voterId = getVoterId();
      return allVotes.some(vote => vote.poll_id === pollId && vote.voter_id === voterId);
    }

    async function loadData() {
      const { data: pollData, error: pollError } = await supabaseClient
        .from("polls")
        .select("*")
        .order("created_at", { ascending: false });

      if (pollError) {
        console.error(pollError);
        featuredPollEl.innerHTML = "Could not load polls.";
        recentPollsEl.innerHTML = "Could not load polls.";
        return;
      }

      polls = pollData || [];

      const { data: voteData, error: voteError } = await supabaseClient
        .from("votes")
        .select("*");

      if (voteError) {
        console.error(voteError);
        allVotes = [];
      } else {
        allVotes = voteData || [];
      }

      renderFeaturedPoll();
      renderRecentPolls();
    }

    function renderFeaturedPoll() {
      if (!polls.length) {
        featuredPollEl.innerHTML = "No polls yet.";
        return;
      }

      featuredPollEl.innerHTML = renderPollCard(polls[0], true);
    }

    function renderRecentPolls() {
      if (!polls.length) {
        recentPollsEl.innerHTML = "No polls yet.";
        return;
      }

      recentPollsEl.innerHTML = polls.map(poll => renderPollCard(poll, false)).join("");
    }

    function renderPollCard(poll, compact) {
      const options = getOptionsFromPoll(poll);
      const votes = getVotesForPoll(poll.id);
      const alreadyVoted = hasAlreadyVoted(poll.id);

      let html = `
        <div class="poll-card">
          <div class="poll-question">${getQuestionText(poll)}</div>
      `;

      if (!alreadyVoted) {
        options.forEach(option => {
          html += `
            <button class="option-btn" onclick="submitVote('${poll.id}', '${option.replace(/'/g, "\\'")}')">
              ${option}
            </button>
          `;
        });
      } else {
        html += `
          <div class="message success">
            You already voted in this poll.
          </div>
        `;
      }

      html += renderResults(poll, votes);

      html += `
          <a class="open-link" href="poll.html?id=${poll.id}">
            Open poll page →
          </a>
        </div>
      `;

      return html;
    }

    function renderResults(poll, votes) {
      const options = getOptionsFromPoll(poll);
      const counts = {};

      options.forEach(option => {
        counts[option] = 0;
      });

      votes.forEach(vote => {
        const choice = getVoteChoice(vote);

        if (counts[choice] !== undefined) {
          counts[choice]++;
        }
      });

      const totalVotes = votes.length;

      let html = `<div class="results">`;

      options.forEach(option => {
        const count = counts[option] || 0;
        const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

        html += `
          <div class="result-row">
            <div class="result-label">${option} (${count})</div>
            <div class="bar-bg">
              <div class="bar-fill" style="width:${percent}%;">
                ${percent}%
              </div>
            </div>
          </div>
        `;
      });

      html += `
          <div class="muted">Total votes: ${totalVotes}</div>
        </div>
      `;

      return html;
    }

    async function submitVote(pollId, selectedOption) {
      const voterId = getVoterId();

      const { error } = await supabaseClient
        .from("votes")
        .insert({
          poll_id: pollId,
          voter_id: voterId,
          option_selected: selectedOption
        });

      if (error) {
        console.error(error);
        alert("Vote failed. You may have already voted.");
        return;
      }

      await loadData();
    }

    loadData();
  </script>

</body>
</html>
